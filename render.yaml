services:
  - type: web
    name: battle-of-the-maroons
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_INITIAL_USER
        value: admin
      - key: ADMIN_INITIAL_PASSWORD
        value: Maroons@2027

